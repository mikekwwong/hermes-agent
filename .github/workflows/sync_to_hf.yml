name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  force_push: true

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          # 這裡引用妳剛才在 GitHub Settings 設定的 Secret
          # 外部的人只會看到這行變數代稱，看不到實際 Token
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 替換為妳自己的 HF 用戶名和 Space 名稱
          git push --force https://mikekwwong:$HF_TOKEN@huggingface.co/spaces/mikekwwong/Hermes_AI main
